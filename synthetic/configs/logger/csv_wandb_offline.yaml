# CSV logger + W&B in OFFLINE mode. Runs are written to <save_dir>/wandb/offline-run-*
# and can be uploaded later with:  wandb sync <save_dir>/wandb/offline-run-*
# (requires `wandb login` once on a machine with internet). No API key needed at train time.

csv:
  _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
  save_dir: "${paths.output_dir}"
  name: "csv/"
  prefix: ""

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  save_dir: "${paths.output_dir}"
  offline: True
  id: null
  anonymous: null
  log_model: False
  prefix: ""
  group: ""
  tags: []
  job_type: ""
